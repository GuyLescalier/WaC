- name: WinGetPackage - [id]
  type: Microsoft.WinGet/Package
  properties:
    - id: Fork.Fork
    - id: Microsoft.PowerShell
    - id: Microsoft.PowerToys
    - id: Microsoft.PowerAutomateDesktop
    - id: Microsoft.PowerBI
    - id: Microsoft.VisualStudioCode
    - id: Google.Chrome
    - id: HP.ImageAssistant

- name: VSComponents
  type: Microsoft.VisualStudio.DSC
  properties:
    productId: Microsoft.VisualStudio.Product.Enterprise
    channelId: VisualStudio.17.Release
    vsConfigFile: C:\WaC\resources\visual-studio\enterprise.vsconfig
    includeRecommended: true

- name: MyCertificate - [resourceName]
  type: MyCompany.Installer/MyCertificate
  properties:
    - resourceName: CR-PACA
      Path: C:\WaC\resources\certificates\_.cr-paca.fr.crt
      StoreName: Root
      Location: LocalMachine
      Ensure: Present
    - resourceName: AC-PACA
      Path: C:\WaC\resources\certificates\Autorite de Certification Region SUD Provence-Alpes-Cote d'Azur.crt
      StoreName: Root
      Location: LocalMachine
      Ensure: Present

- name: MyWindowsDefenderExclusion - [Value]
  type: MyCompany.Installer/MyWindowsDefenderExclusion
  properties:
    - Type: Path
      Value: C:\Projets
    - Type: Path
      Value: C:\Users\%user%\.dotnet\tools
    - Type: Path
      Value: C:\Users\%user%\scoop

- name: MyNodeVersion - [Version]
  type: MyCompany.Packages/MyNodeVersion
  properties:
    - version: lts
      ensure: Used
    - version: "18"

- name: MyHosts - [Name]
  type: MyCompany.Installer/MyHosts
  properties:
    path: C:\WaC\resources\hosts
    name: PACA

- name: My PowerShell - [Name]
  type: MyCompany.Installer/MyPSProfile
  properties:
    name: MyPSProfile
    ensure: Present
    PowerShellVersion: v7
    MyHost: AllHosts
    sourceFilePath: C:\Project\WaC\DSC\MyProfile.ps1
